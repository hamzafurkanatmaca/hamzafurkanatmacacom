<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-label="Mikroservis mimarisinde API Gateway'in konumu">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 600 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
      .text { font: 14px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrowhead); fill: none; }
      .dashed { stroke-dasharray: 6 6; }
      .badge { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; rx: 6; ry: 6; }
      .muted { fill: #6b7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="540" fill="#ffffff"/>

  <!-- Gözlemlenebilirlik -->
  <rect class="box" x="330" y="30" width="430" height="66" />
  <text class="title" x="545" y="60" text-anchor="middle">Gözlemlenebilirlik</text>
  <text class="text" x="545" y="82" text-anchor="middle">Correlation Id · Süre · Hata Oranı · 429 Sayısı</text>

  <!-- İstemciler -->
  <rect class="box" x="40" y="200" width="170" height="140" />
  <text class="title" x="125" y="245" text-anchor="middle">İstemciler</text>
  <text class="text" x="125" y="272" text-anchor="middle">Web · Mobil</text>
  <text class="text" x="125" y="294" text-anchor="middle">3. Parti</text>

  <!-- API Gateway -->
  <rect class="box" x="280" y="165" width="260" height="215" />
  <text class="title" x="410" y="200" text-anchor="middle">API Gateway</text>

  <rect class="badge" x="300" y="218" width="220" height="34" />
  <text class="text" x="410" y="240" text-anchor="middle">Kimlik Doğrulama · Yetki</text>

  <rect class="badge" x="300" y="262" width="220" height="34" />
  <text class="text" x="410" y="284" text-anchor="middle">Yönlendirme · Rate Limit</text>

  <rect class="badge" x="300" y="306" width="220" height="34" />
  <text class="text" x="410" y="328" text-anchor="middle">Cache · Devre Kesici</text>

  <!-- Servisler -->
  <rect class="box" x="760" y="130" width="280" height="58" />
  <text class="title" x="900" y="165" text-anchor="middle">Sipariş Servisi</text>

  <rect class="box" x="760" y="202" width="280" height="58" />
  <text class="title" x="900" y="237" text-anchor="middle">Ürün Servisi</text>

  <rect class="box" x="760" y="274" width="280" height="58" />
  <text class="title" x="900" y="309" text-anchor="middle">Ödeme Servisi</text>

  <rect class="box" x="760" y="346" width="280" height="58" />
  <text class="title" x="900" y="381" text-anchor="middle">Kullanıcı Servisi</text>

  <!-- Kimlik sağlayıcı -->
  <rect class="box" x="280" y="435" width="260" height="70" />
  <text class="title" x="410" y="468" text-anchor="middle">Kimlik Sağlayıcı</text>
  <text class="text" x="410" y="490" text-anchor="middle">JWKS · Token Doğrulama</text>

  <!-- Servis keşfi -->
  <rect class="box" x="600" y="435" width="240" height="70" />
  <text class="title" x="720" y="468" text-anchor="middle">Servis Keşfi</text>
  <text class="text" x="720" y="490" text-anchor="middle">DNS · Consul · K8s</text>

  <!-- İstemci -> Gateway -->
  <line class="arrow" x1="210" y1="270" x2="280" y2="270" />

  <!-- Gateway -> Servisler -->
  <line class="arrow" x1="540" y1="262" x2="760" y2="159" />
  <line class="arrow" x1="540" y1="268" x2="760" y2="231" />
  <line class="arrow" x1="540" y1="278" x2="760" y2="303" />
  <line class="arrow" x1="540" y1="284" x2="760" y2="375" />

  <!-- Gözlemlenebilirlik tapları -->
  <line class="arrow dashed" x1="410" y1="165" x2="410" y2="100" />
  <line class="arrow dashed" x1="900" y1="130" x2="900" y2="100" />

  <!-- Gateway -> Kimlik sağlayıcı -->
  <line class="arrow dashed" x1="410" y1="380" x2="410" y2="435" />

  <!-- Servis keşfi -> Gateway -->
  <line class="arrow dashed" x1="620" y1="435" x2="545" y2="370" />

  <text class="text muted" x="125" y="365" text-anchor="middle">tek adres</text>
  <text class="text muted" x="650" y="205" text-anchor="middle">iç ağ</text>
</svg>
